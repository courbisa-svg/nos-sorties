name: Construire l'APK

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**", "capacitor.config.json", "package.json", "package-lock.json", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déballer le zip s'il a été déposé tel quel
        run: |
          if [ -f nos-sorties.zip ]; then
            unzip -o -q nos-sorties.zip -x '.github/*'
            git rm -q --cached nos-sorties.zip && rm nos-sorties.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fichiers du projet déballés depuis le zip"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Réglages de l'appli
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          EVENTS_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/data/events.json"
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|; s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|; s|__EVENTS_URL__|${EVENTS_URL}|" www/config.js
          if grep -qE "__(SUPABASE|EVENTS)" www/config.js; then echo "Il manque le secret SUPABASE_URL ou SUPABASE_ANON_KEY"; exit 1; fi
      - run: npx cap sync android
      - name: Clé de signature (toujours la même)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ${#KEYSTORE_PASSWORD} -lt 8 ]; then echo "Ajoutez le secret KEYSTORE_PASSWORD (8 caractères minimum)"; exit 1; fi
          if [ ! -f android/app/release.keystore.enc ]; then
            keytool -genkeypair -keystore android/app/release.keystore -alias nossorties -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Nos sorties, C=FR"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in android/app/release.keystore -out android/app/release.keystore.enc -pass env:KEYSTORE_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore.enc
            git commit -m "Clé de signature chiffrée"
            git push
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -in android/app/release.keystore.enc -out android/app/release.keystore -pass env:KEYSTORE_PASSWORD
          fi
      - name: Compilation
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../NosSorties.apk
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Nos sorties 1.${{ github.run_number }}
          make_latest: true
          files: NosSorties.apk
